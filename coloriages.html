<style>
/* Layout : un atelier de dessin — choix de l'âge en haut, la feuille au centre, la boîte de crayons dessous, gros boutons pour petits doigts */
:root {
  --bg: #fbf1e6;
  --panel: #fffaf4;
  --ink: #33261d;
  --muted: #76614f;
  --accent: #e0661f;
  --accent-ink: #ffffff;
  --night: #3d2b56;
  --line: #e8d5c0;
  --paper: #ffffff;
  --stroke: #33261d;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1814; --panel: #29211b; --ink: #f6eadc; --muted: #c6b3a1;
    --accent: #f08a3e; --accent-ink: #1d1814; --night: #b9a3e0; --line: #4a3c31; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1814; --panel: #29211b; --ink: #f6eadc; --muted: #c6b3a1;
  --accent: #f08a3e; --accent-ink: #1d1814; --night: #b9a3e0; --line: #4a3c31; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 28px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-direction: column; gap: 4px; }
.book { font-family: var(--display); font-weight: 600; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--night); margin: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: .95rem; }
.ages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ages button {
  font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.2;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 16px; padding: 10px 12px; cursor: pointer; min-height: 56px;
}
.ages button small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.ages button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.ages button[aria-pressed="true"] small { color: var(--accent-ink); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav button, .tools button {
  font-family: var(--display); font-weight: 600; font-size: 1rem;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 10px 16px; cursor: pointer; min-height: 46px;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nav .name { font-family: var(--display); font-weight: 600; font-size: 1.1rem; text-align: center; flex: 1; min-width: 0; }
.nav .count { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.sheet { background: var(--paper); border-radius: 18px; border: 2px solid var(--line); padding: 10px; position: relative; }
.sheet svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: manipulation; }
.sheet svg [data-zone] { cursor: pointer; stroke: var(--stroke); stroke-width: 3; stroke-linejoin: round; transition: fill .15s ease; }
.sheet svg .deco { fill: none; stroke: var(--stroke); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.sheet svg .dot { fill: var(--stroke); pointer-events: none; }
.bravo {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700;
  padding: 8px 18px; border-radius: 999px; font-size: 1.1rem; white-space: nowrap;
}
.box { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.crayons { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 10px; }
.crayon { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
.crayon[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.08); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }
@media (prefers-reduced-motion: reduce) { .sheet svg [data-zone], .crayon { transition: none; } }
</style>

</div>

let age = "petits", index = 0, color = COLORS[1], erasing = false;
let fills = {};
try { fills = JSON.parse(localStorage.getItem("mila-coloriages-v2") || "{}") || {}; } catch (e) { fills = {}; }
function save() { try { localStorage.setItem("mila-coloriages-v2", JSON.stringify(fills)); } catch (e) {} }

const drawingEl = document.getElementById("drawing");
const nameEl = document.getElementById("name");
const bravo = document.getElementById("bravo");

function current() { return SETS[age][index]; }

// Dessins en image (illustrations au trait) : remplissage par zone sur un canvas.
let cv = null, ctx = null, lineMask = null, W = 0, H = 0;
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function floodFill(x, y, hex) {
  if (!ctx || lineMask[y * W + x]) return false;
  const img = ctx.getImageData(0, 0, W, H), data = img.data, [r, g, b] = hexToRgb(hex);
  const seen = new Uint8Array(W * H), stack = [y * W + x];
  while (stack.length) {
    const p = stack.pop();
    if (seen[p] || lineMask[p]) continue;
    seen[p] = 1;
    const i = p * 4; data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255;
    const px = p % W;
    if (px > 0) stack.push(p - 1);
    if (px < W - 1) stack.push(p + 1);
    if (p >= W) stack.push(p - W);
    if (p < W * (H - 1)) stack.push(p + W);
  }
  ctx.putImageData(img, 0, 0);
  return true;
}
function renderImage(d) {
  drawingEl.innerHTML = `<canvas role="img" aria-label="${d.name} à colorier" style="display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer"></canvas>`;
  cv = drawingEl.querySelector("canvas"); ctx = cv.getContext("2d", { willReadFrequently: true });
  const im = new Image();
  im.onload = () => {
    W = cv.width = im.naturalWidth; H = cv.height = im.naturalHeight;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H); ctx.drawImage(im, 0, 0);
    const px = ctx.getImageData(0, 0, W, H).data;
    lineMask = new Uint8Array(W * H);
    for (let p = 0; p < W * H; p++) { const i = p * 4; lineMask[p] = (px[i] + px[i + 1] + px[i + 2]) / 3 < 140 ? 1 : 0; }
    (fills[d.id].steps || []).forEach(([x, y, c]) => floodFill(x, y, c));
  };
  im.src = d.img;
  bravo.hidden = true;
}

function render() {
  const d = current();
  fills[d.id] = fills[d.id] || {};
  nameEl.innerHTML = `${d.name}<span class="count">Dessin ${index + 1} sur ${SETS[age].length}</span>`;
  if (d.img) { renderImage(d); return; }
  cv = null; ctx = null;
  drawingEl.innerHTML = `<svg viewBox="0 0 400 400" role="img" aria-label="${d.name} à colorier" xmlns="http://www.w3.org/2000/svg">${d.svg}</svg>`;
  drawingEl.querySelectorAll("[data-zone]").forEach(z => z.setAttribute("fill", fills[d.id][z.dataset.zone] || "#ffffff"));
  checkDone();
}
function checkDone() {
  const d = current();
  if (d.img) { bravo.hidden = true; return; }
  const zones = drawingEl.querySelectorAll("[data-zone]");
  bravo.hidden = ![...zones].every(z => fills[d.id][z.dataset.zone]);
}
drawingEl.addEventListener("click", e => {
  const d = current();
  if (d.img) {
    if (!cv || !lineMask) return;
    const r = cv.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) * W / r.width), y = Math.floor((e.clientY - r.top) * H / r.height);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const c = erasing ? "#ffffff" : color;
    if (floodFill(x, y, c)) { (fills[d.id].steps = fills[d.id].steps || []).push([x, y, c]); save(); }
    return;
  }
  const z = e.target.closest("[data-zone]");
  if (!z) return;
  if (erasing) { delete fills[d.id][z.dataset.zone]; z.setAttribute("fill", "#ffffff"); }
  else { fills[d.id][z.dataset.zone] = color; z.setAttribute("fill", color); }
  save(); checkDone();
});

const box = document.getElementById("crayons");
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "crayon"; b.style.background = c;
  b.setAttribute("aria-label", "Crayon " + NAMES[i]);
  b.setAttribute("aria-pressed", c === color ? "true" : "false");
  b.addEventListener("click", () => {
    color = c; erasing = false;
    box.querySelectorAll(".crayon").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    document.getElementById("eraser").classList.remove("primary");
  });
  box.appendChild(b);
});
document.getElementById("eraser").addEventListener("click", ev => {
  erasing = true;
  box.querySelectorAll(".crayon").forEach(x => x.setAttribute("aria-pressed", "false"));
  ev.currentTarget.classList.add("primary");
});
document.getElementById("reset").addEventListener("click", () => { fills[current().id] = {}; save(); render(); });
document.getElementById("magic").addEventListener("click", () => {
  const d = current();
  if (d.img) return;
  drawingEl.querySelectorAll("[data-zone]").forEach(z => {
    const c = COLORS[Math.floor(Math.random() * (COLORS.length - 1))];
    fills[d.id][z.dataset.zone] = c; z.setAttribute("fill", c);
  });
  save(); checkDone();
});
function setAge(a) {
  age = a; index = 0;
  document.getElementById("age-petits").setAttribute("aria-pressed", a === "petits");
  document.getElementById("age-grands").setAttribute("aria-pressed", a === "grands");
  render();
}
document.getElementById("age-petits").addEventListener("click", () => setAge("petits"));
document.getElementById("age-grands").addEventListener("click", () => setAge("grands"));
document.getElementById("prev").addEventListener("click", () => { index = (index + SETS[age].length - 1) % SETS[age].length; render(); });
document.getElementById("next").addEventListener("click", () => { index = (index + 1) % SETS[age].length; render(); });
render();
</script>
